
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TACKLE NAVI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf4fc;color:#123e60;font-family:sans-serif}
header{background:#123e60;color:white;padding:20px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:auto;padding:18px}
h2{margin-top:0}
.hero{background:linear-gradient(135deg,#176b9b,#123e60);color:white;padding:24px;border-radius:18px;margin-bottom:20px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:inherit;cursor:pointer}
.tile{background:white;border:1px solid #d6e5ef;border-radius:16px;padding:20px 8px;color:#123e60;font-size:16px;font-weight:bold;min-height:100px}
.tile span{display:block;font-size:32px;margin-bottom:8px}
.primary{width:100%;background:#176b9b;color:white;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:bold;margin-bottom:14px}
.back,.sub{background:white;border:1px solid #ccdce8;border-radius:10px;padding:12px;color:#123e60;margin:0 6px 12px 0}
.panel{background:white;padding:18px;border-radius:14px;margin-bottom:14px;overflow-wrap:anywhere}
input,select,textarea{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ccdce8;border-radius:8px;font-size:16px;background:white}
label{display:block}
footer{text-align:center;padding:20px;font-size:12px}
small{color:#52748c}
.good{color:#168047;font-weight:bold}
.warn{color:#b77910;font-weight:bold}
.bad{color:#c0392b;font-weight:bold}
.photo{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#eef4f8}
.progress{height:6px;background:#d2e4ef;border-radius:10px;margin:0 0 20px;overflow:hidden}
.progress div{height:100%;background:#176b9b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:white;padding:18px;border-radius:12px;text-align:center}
.stat strong{display:block;font-size:26px;margin-top:8px}
</style>
</head>
<body>
<header onclick="home()">🎣 TACKLE NAVI</header>
<main id="app"></main>
<footer>TACKLE NAVI | Ver. 0.3</footer>
<script>
const app=document.getElementById('app');
let planData={};
let photoData='';
let photoLoading=false;
const db={
'アジ':['サビキ釣り','アジング','ウキ釣り'],
'サバ':['サビキ釣り','ショアジギング'],
'シーバス':['ルアー釣り','ウキ釣り'],
'ヒラメ':['ルアー釣り','泳がせ釣り'],
'クロダイ':['フカセ釣り','チニング'],
'メバル':['メバリング','ウキ釣り'],
'イカ':['エギング','ウキ釣り'],
'キス':['投げ釣り'],
'カサゴ':['穴釣り','ルアー釣り'],
'マダイ':['タイラバ','フカセ釣り'],
'ブリ':['ショアジギング','泳がせ釣り'],
'タチウオ':['ルアー釣り','ウキ釣り'],
'ブラックバス':['ルアー釣り'],
'トラウト':['ルアー釣り','エサ釣り'],
'アユ':['友釣り','エサ釣り'],
'コイ':['吸い込み釣り','ウキ釣り'],
'フナ':['ウキ釣り'],
'ナマズ':['ルアー釣り'],
'ヤマメ':['ルアー釣り','エサ釣り'],
'イワナ':['ルアー釣り','エサ釣り']
};
const freshwater=['ブラックバス','トラウト','アユ','コイ','フナ','ナマズ','ヤマメ','イワナ'];
const methods={
'アジング':['アジングロッド','小型スピニングリール','ジグヘッド・ワーム','5〜7ft','1000〜2000番',0.5,5],
'メバリング':['メバリングロッド','小型スピニングリール','ジグヘッド・ワーム','6〜8ft','1000〜2500番',1,7],
'サビキ釣り':['磯竿・万能竿','スピニングリール','サビキ仕掛け・コマセ','3〜5m','2000〜3000番'],
'ショアジギング':['ショアジギングロッド','スピニングリール','メタルジグ','9〜11ft','4000〜6000番',30,60],
'エギング':['エギングロッド','スピニングリール','エギ','7〜9ft','2500〜3000番'],
'チニング':['チニングロッド','適合するリール','チニング用ルアー','7〜8ft','2000〜3000番',5,15],
'ルアー釣り':['対象魚用ロッド','適合するリール','対象魚用ルアー','対象魚による','対象魚による'],
'投げ釣り':['投げ竿','スピニングリール','天秤・投げ仕掛け','3〜4m','3000〜5000番'],
'穴釣り':['短竿','小型リール','ブラクリ仕掛け','1〜2m','小型'],
'フカセ釣り':['磯竿','スピニングリール','ウキ・ハリ・コマセ','4〜5.3m','2500〜3000番'],
'泳がせ釣り':['対象魚用ロッド','適合するリール','泳がせ仕掛け','対象魚による','対象魚による'],
'ウキ釣り':['万能竿・磯竿','必要に応じたリール','ウキ・ハリ・エサ','釣り場による','釣り場による'],
'友釣り':['アユ竿','不要','友釣り仕掛け','7〜9m','不要'],
'エサ釣り':['対象魚用ロッド','必要に応じたリール','ハリ・エサ','対象魚による','対象魚による'],
'吸い込み釣り':['コイ用ロッド','適合するリール','吸い込み仕掛け','3〜4m','3000〜5000番'],
'タイラバ':['タイラバロッド','ベイトリール','タイラバ','6〜7ft','小型両軸']
};
function read(key){
try{
let d=JSON.parse(localStorage.getItem(key)||'[]');
return Array.isArray(d)?d:[];
}catch(e){return []}
}
function write(key,data){
try{
localStorage.setItem(key,JSON.stringify(data));
return true;
}catch(e){
alert('保存できません。端末の空き容量や写真サイズを確認してください。');
return false;
}
}
function esc(v){
return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function show(html){
app.innerHTML=html;
window.scrollTo(0,0);
}
function back(fn='home'){
return `<button class="back" onclick="${fn}()">← 戻る</button>`
}
function step(n){
return `<small>STEP ${n} / 5</small><div class="progress"><div style="width:${n*20}%"></div></div>`
}
function choices(items,fn,emoji){
return `<div class="menu">${items.map(x=>`<button class="tile" onclick="${fn}('${x}')"><span>${emoji}</span>${x}</button>`).join('')}</div>`
}
function value(id){
return document.getElementById(id)?.value.trim()||'';
}
function today(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function field(label,id,v='',type='text',extra=''){
return `<label>${label}<input id="${id}" type="${type}" value="${esc(v)}" ${extra}></label>`
}
function options(items,current){
return items.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('');
}
function home(){
show(`
<div class="hero">
<h2>次の釣りを、もっと楽しく。</h2>
<p>釣りの計画から釣果の記録まで。</p>
</div>
<div class="stats">
<div class="stat">登録タックル<strong>${read('tackle').length}</strong></div>
<div class="stat">釣行プラン<strong>${read('plans').length}</strong></div>
</div><br>
<button class="primary" onclick="start()">🎣 釣りを計画する</button>
<div class="menu">
<button class="tile" onclick="tackle()"><span>🎒</span>マイタックル</button>
<button class="tile" onclick="savedPlans()"><span>📅</span>マイ釣行プラン</button>
<button class="tile" onclick="catchForm()"><span>📷</span>釣果記録</button>
<button class="tile" onclick="album()"><span>🐟</span>釣果アルバム</button>
<button class="tile" onclick="pending('全国釣果マップ')"><span>🗺️</span>全国釣果マップ</button>
<button class="tile" onclick="pending('ランキング')"><span>🏆</span>ランキング</button>
<button class="tile" onclick="pending('釣具データベース')"><span>🔍</span>釣具データベース</button>
<button class="tile" onclick="settings()"><span>⚙️</span>設定</button>
</div>`)
}
function start(){
planData={};
water();
}
function water(){
show(back()+`
<h2>どこで釣りをする？</h2>
<button class="primary" onclick="fish('海釣り')">🌊 海釣り</button>
<button class="primary" onclick="fish('川・湖釣り')">🏞️ 川・湖釣り</button>`)
}
function fish(type){
planData.type=type;
fishScreen();
}
function fishScreen(){
let items=Object.keys(db).filter(x=>planData.type==='海釣り'?!freshwater.includes(x):freshwater.includes(x));
show(back('water')+step(1)+`<h2>釣りたい魚を選択</h2>`+choices(items,'method','🐟'))
}
function method(name){
planData.fish=name;
methodScreen();
}
function methodScreen(){
show(back('fishScreen')+step(2)+`<h2>${planData.fish}の釣り方</h2>`+choices(db[planData.fish],'place','🎣'))
}
function place(name){
planData.method=name;
placeScreen();
}
function placeScreen(){
let items=planData.type==='海釣り'?['堤防','漁港','砂浜','磯','船']:['河川','湖','池','管理釣り場'];
show(back('methodScreen')+step(3)+`<h2>釣り場を選択</h2>`+choices(items,'recommend','📍'))
}
function recommend(name){
planData.place=name;
recommendScreen();
}
function judge(t,g,i){
if(i===0&&g[5]!=null){
if(t.min==null||t.max==null||t.min===''||t.max==='')return ['warn','重量スペック未登録'];
let min=Number(t.min),max=Number(t.max);
if(!Number.isFinite(min)||!Number.isFinite(max)||min>max)return ['warn','重量スペック要確認'];
if(min<=g[5]&&max>=g[6])return ['good','推奨重量範囲をカバー'];
if(max>=g[5]&&min<=g[6])return ['warn','推奨重量範囲と一部重複'];
return ['bad','推奨重量範囲外'];
}
if(i===1&&t.size){
let m=g[4].match(/^(\d+)〜(\d+)番$/);
let n=String(t.size).match(/^\d+$/);
if(m&&n){
let size=Number(n[0]);
return size>=Number(m[1])&&size<=Number(m[2])?['good','推奨番手の範囲内']:['warn','推奨番手と異なる'];
}
}
return ['warn','詳細な適合性は未判定'];
}
function recommendScreen(){
let g=methods[planData.method];
let owned=read('tackle');
let categories=['ロッド','リール','仕掛け'];
let missing=[];
let matches=categories.map((c,i)=>{
if(g[i]==='不要')return `<div class="panel"><b>${c}</b><p>不要</p></div>`;
let list=owned.filter(t=>t.category===c);
if(!list.length){
missing.push(c);
return `<div class="panel"><b>${c}</b><p class="bad">未登録</p></div>`;
}
return `<div class="panel"><b>${c}</b>${list.map(t=>{
let j=judge(t,g,i);
return `<p>${esc(t.maker||'')} ${esc(t.name)}<br><small class="${j[0]}">${j[1]}</small></p>`
}).join('')}</div>`
}).join('');
show(back('placeScreen')+step(4)+`
<h2>おすすめタックル</h2>
<p>${planData.fish} × ${planData.method}</p>
<div class="panel">
<h3>🎣 ロッド</h3>
<p>${g[0]}</p>
<p>長さの目安：${g[3]}</p>
${g[5]!=null?`<p>ルアー重量の目安：${g[5]}〜${g[6]}g</p>`:''}
</div>
<div class="panel">
<h3>⚙️ リール</h3>
<p>${g[1]}</p>
<p>番手の目安：${g[4]}</p>
</div>
<div class="panel">
<h3>🪝 仕掛け</h3><p>${g[2]}</p>
</div>
<h3>マイタックルとの照合</h3>
${matches}
<div class="panel">
<h3>未登録の釣具</h3>
<p>${missing.length?missing.join('・'):'必要カテゴリは登録済み'}</p>
<small>未登録は未所有とは限りません。適合判定は重量・番手の一部条件のみです。釣り場や対象魚、製品仕様も確認してください。</small>
</div>
<button class="primary" onclick="details()">釣行プランを作成する</button>`)
}
function details(){
show(back('recommendScreen')+step(5)+`
<h2>釣行プラン作成</h2>
<div class="panel">
<p>対象魚：${planData.fish}</p>
<p>釣り方：${planData.method}</p>
<p>釣り場：${planData.place}</p>
</div>
<form onsubmit="savePlan(event)">
${field('釣行日','date',planData.date||today(),'date','required')}
${field('釣り場の名称','location',planData.location,'text','required')}
<label>メモ<textarea id="memo">${esc(planData.memo)}</textarea></label>
<button class="primary">釣行プランを保存</button>
</form>`)
}
function savePlan(e){
e.preventDefault();
let data=read('plans');
data.push({...planData,date:value('date'),location:value('location'),memo:value('memo')});
if(write('plans',data))savedPlans();
}
function savedPlans(){
let data=read('plans');
show(back()+`<h2>マイ釣行プラン</h2>`+
(data.length?data.map((p,i)=>`<div class="panel">
<b>${esc(p.date)}　${esc(p.fish)}</b>
<p>📍 ${esc(p.location)}</p>
<p>${esc(p.type)} / ${esc(p.method)} / ${esc(p.place)}</p>
<p>${esc(p.memo)}</p>
<button class="sub" onclick="editPlan(${i})">編集</button>
<button class="sub" onclick="removeItem('plans',${i})">削除</button>
<button class="sub" onclick="catchFromPlan(${i})">釣果を記録</button>
</div>`).join(''):'<p>保存されたプランはありません。</p>')+
`<button class="primary" onclick="start()">新しい釣行プラン</button>`)
}
function editPlan(i){
let p=read('plans')[i];
if(!p)return savedPlans();
show(back('savedPlans')+`
<h2>釣行プラン編集</h2>
<form class="panel" onsubmit="updatePlan(event,${i})">
<p>${esc(p.fish)} / ${esc(p.method)}</p>
${field('釣行日','date',p.date,'date','required')}
${field('釣り場の名称','location',p.location,'text','required')}
<label>メモ<textarea id="memo">${esc(p.memo)}</textarea></label>
<button class="primary">変更を保存</button>
</form>`)
}
function updatePlan(e,i){
e.preventDefault();
let data=read('plans');
if(!data[i])return savedPlans();
data[i]={...data[i],date:value('date'),location:value('location'),memo:value('memo')};
if(write('plans',data))savedPlans();
}
function tackle(){
let data=read('tackle');
show(back()+`
<h2>マイタックル</h2>
<button class="primary" onclick="tackleForm()">＋ タックルを登録</button>
${data.length?data.map((t,i)=>`<div class="panel">
<small>${esc(t.category)}</small>
<h3>${esc(t.maker||'')} ${esc(t.name)}</h3>
${t.length?`<p>長さ：${esc(t.length)}</p>`:''}
${t.power?`<p>硬さ：${esc(t.power)}</p>`:''}
${t.min!=null&&t.min!==''&&t.max!=null&&t.max!==''?`<p>適合重量：${esc(t.min)}〜${esc(t.max)}g</p>`:''}
${t.size?`<p>番手：${esc(t.size)}</p>`:''}
${t.line?`<p>ライン：${esc(t.line)}</p>`:''}
<p>${esc(t.memo||'')}</p>
<button class="sub" onclick="tackleForm(${i})">編集</button>
<button class="sub" onclick="removeItem('tackle',${i})">削除</button>
</div>`).join(''):'<p>まだ登録されていません。</p>'}`)
}
function tackleForm(i=-1){
let t=read('tackle')[i]||{};
show(back('tackle')+`
<h2>${i<0?'タックル登録':'タックル編集'}</h2>
<form class="panel" onsubmit="saveTackle(event,${i})">
<label>種類<select id="category" onchange="specFields()">
${options(['ロッド','リール','仕掛け','ライン','その他'],t.category||'ロッド')}
</select></label>
${field('メーカー','maker',t.maker)}
${field('商品名・型番','name',t.name,'text','required')}
<div id="specs"></div>
<label>メモ<textarea id="memo">${esc(t.memo)}</textarea></label>
<button class="primary">保存する</button>
</form>`);
specFields(t);
}
function specFields(t={}){
let c=value('category');
let el=document.getElementById('specs');
if(c==='ロッド'){
el.innerHTML=`
${field('長さ（例：6.6ft）','length',t.length)}
<label>硬さ<select id="power">${options(['未設定','UL','L','ML','M','MH','H','XH'],t.power||'未設定')}</select></label>
${field('適合ルアー重量 最小(g)','min',t.min,'number','min="0" step="0.1"')}
${field('適合ルアー重量 最大(g)','max',t.max,'number','min="0" step="0.1"')}`;
}else if(c==='リール'){
el.innerHTML=`
<label>リールタイプ<select id="reelType">${options(['スピニング','ベイト','両軸','その他'],t.reelType||'スピニング')}</select></label>
${field('番手（例：2000）','size',t.size)}
${field('ラインの種類・太さ','line',t.line)}`;
}else if(c==='ライン'){
el.innerHTML=field('ラインの種類・太さ','line',t.line);
}else{
el.innerHTML='';
}
}
function saveTackle(e,i){
e.preventDefault();
let min=value('min'),max=value('max');
if(min!==''&&max!==''&&Number(min)>Number(max)){
alert('最小重量は最大重量以下にしてください');
return;
}
let t={};
['category','maker','name','length','power','min','max','size','line','reelType','memo'].forEach(k=>t[k]=value(k));
let data=read('tackle');
if(i<0)data.push(t);
else data[i]=t;
if(write('tackle',data))tackle();
}
function catchFromPlan(i){
let p=read('plans')[i];
if(p)catchForm({fish:p.fish,location:p.location,date:p.date,method:p.method});
}
function catchForm(c={},i=-1){
photoData=c.photo||'';
photoLoading=false;
show(back()+`
<h2>📷 釣果記録</h2>
<form class="panel" onsubmit="saveCatch(event,${i})">
${field('釣行日','date',c.date||today(),'date','required')}
${field('釣り場','location',c.location,'text','required')}
${field('魚種','fish',c.fish,'text','required')}
${field('釣り方','method',c.method)}
${field('釣れた数（匹）','count',c.count??1,'number','min="0" step="1" required')}
${field('最大サイズ（cm）','length',c.length,'number','min="0" step="0.1"')}
${field('使用タックル','gear',c.gear)}
<label>釣果写真<input type="file" accept="image/*" onchange="loadPhoto(event)"></label>
<div id="preview">${photoData?`<img class="photo" src="${esc(photoData)}">`:''}</div>
<button type="button" class="sub" onclick="clearPhoto()">写真を取り消す</button>
<label>メモ<textarea id="memo">${esc(c.memo)}</textarea></label>
<button class="primary">釣果を保存する</button>
</form>`)
}
function clearPhoto(){
photoData='';
photoLoading=false;
let el=document.getElementById('preview');
if(el)el.innerHTML='';
let input=app.querySelector('input[type=file]');
if(input)input.value='';
}
let photoToken=0;
function loadPhoto(e){
let file=e.target.files[0];
if(!file)return;
let token=++photoToken;
photoLoading=true;
let reader=new FileReader();
reader.onerror=()=>{
if(token!==photoToken)return;
photoLoading=false;
alert('写真を読み込めませんでした');
};
reader.onload=()=>{
if(token!==photoToken||!photoLoading)return;
let img=new Image();
img.onerror=()=>{
if(token!==photoToken)return;
photoLoading=false;
alert('この画像形式は読み込めませんでした');
};
img.onload=()=>{
if(token!==photoToken||!photoLoading)return;
let canvas=document.createElement('canvas');
let ratio=Math.min(1,800/Math.max(img.width,img.height));
canvas.width=Math.max(1,Math.round(img.width*ratio));
canvas.height=Math.max(1,Math.round(img.height*ratio));
canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
photoData=canvas.toDataURL('image/jpeg',0.7);
photoLoading=false;
let el=document.getElementById('preview');
if(el)el.innerHTML=`<img class="photo" src="${photoData}">`;
};
img.src=reader.result;
};
reader.readAsDataURL(file);
}
function saveCatch(e,i){
e.preventDefault();
if(photoLoading){
alert('写真の読み込みが終わるまでお待ちください');
return;
}
let c={photo:photoData};
['date','location','fish','method','count','length','gear','memo'].forEach(k=>c[k]=value(k));
let data=read('catches');
if(i<0)data.push(c);
else data[i]=c;
if(write('catches',data))album();
}
function album(){
let data=read('catches');

function prepStatus(p){
let items=checklistItems(p);
let checks=p.checklist||{};
let done=items.filter(x=>checks[x.id]===true).length;

return {
done:done,
total:items.length,
percent:Math.round(done/items.length*100),
missing:items.filter(x=>checks[x.id]!==true)
};
}

function prepSummary(p){
let s=prepStatus(p);

return `
<div class="prepnum">${s.percent}%</div>
<div class="prepbar">
<div style="width:${s.percent}%"></div>
</div>
<small>${s.done} / ${s.total} 項目完了</small>
`;
}

function togglePrep(i,id,input){

let data=read('plans');

if(!data[i])return savedPlans();

let p=data[i];

p.checklist={
...(p.checklist||{}),
[id]:input.checked
};

if(!write('plans',data)){
input.checked=!input.checked;
return;
}

input.closest('label').classList.toggle(
'done',input.checked
);

document.getElementById('prepSummary').innerHTML=
prepSummary(p);

document.getElementById('missingPrep').innerHTML=
missingPrepHTML(p);
}

if(!confirm('チェック状況をリセットしますか？'))return;

/* 天気コード変換 */

function weatherName06(code){

if(code==null)return '未取得';

if(code===0)return '快晴';

if(code===1)return '晴れ';

if(code===2)return '晴れ時々曇り';

if(code===3)return '曇り';

if([45,48].includes(code))return '霧';

if([51,53,55,56,57].includes(code))
return '霧雨';

if([61,63,65,66,67].includes(code))
return '雨';

if([71,73,75,77,85,86].includes(code))
return '雪';

if([80,81,82].includes(code))
return 'にわか雨';

if([95,96,99].includes(code))
return '雷雨';

return '不明';

}


/* 風向変換 */

function windDirection06(deg){

if(deg==null)return '未取得';

let dirs=[
'北','北北東','北東','東北東',
'東','東南東','南東','南南東',
'南','南南西','南西','西南西',
'西','西北西','北西','北北西'
];

return dirs[Math.round(deg/22.5)%16];

}


/* 数値表示 */

function weatherValue06(v,unit){

Number(v).toFixed(1)+unit;

/* API通信 */

async function api06(url){

let controller=new AbortController();

let timer=setTimeout(
()=>controller.abort(),15000
);

try{

let response=await fetch(url,{
signal:controller.signal
});

if(!response.ok){
throw new Error('通信エラー');
}

let data=await response.json();

if(data.error){
throw new Error('データ取得エラー');
}

return data;

}finally{

clearTimeout(timer);

}

}

async function fetchWeather06(i){

let lonText=value('longitude06');

let lat=Number(latText);
let lon=Number(lonText);

'weatherResults06'
);

let token=++weatherRequest06;

!Number.isFinite(lat)||

Math.abs(lat)>90||
Math.abs(lon)>180){

el.innerHTML=
'<div class="panel">正しい緯度・経度を設定してください。</div>';

return;

}

let date=p.date;

let diff=Math.round(
(Date.parse(date+'T00:00:00Z')-
Date.parse(today()+'T00:00:00Z'))
/86400000
);

if(!Number.isFinite(diff)||
diff<0||diff>15){

el.innerHTML=`

plans[i].weatherLon=lon;

/* 風速グラフ */

function windGraph06(w){

let data=w.wind_speed_10m||[];

let valid=data.filter(
v=>v!=null&&Number.isFinite(v)
);

if(!valid.length)return '';

let max=Math.max(5,...valid);

let path='';

let active=false;

data.forEach((v,i)=>{

if(v==null||!Number.isFinite(v)){

active=false;

return;

}

let x=35+i*280/
Math.max(1,data.length-1);

let y=125-v/max*100;

path+=(active?' L':' M')+x+' '+y;

active=true;

});

return `

<div class="panel">

<h3>時間帯別風速グラフ</h3>

<svg viewBox="0 0 340 155"
style="width:100%;height:auto">

${[0,.25,.5,.75,1].map(v=>`

<line x1="35" y1="${125-v*100}"
x2="315" y2="${125-v*100}"
stroke="#d6e5ef"/>

<text x="28" y="${129-v*100}"
font-size="10" text-anchor="end"
fill="#52748c">

${(max*v).toFixed(1)}

</text>

`).join('')}

<path d="${path}"
fill="none"
stroke="#176b9b"
stroke-width="3"/>

${w.time.map((t,i)=>
i%4===0?`

<text
x="${35+i*280/
Math.max(1,data.length-1)}"
y="145"
font-size="10"
text-anchor="middle"
fill="#52748c">

${esc(t.slice(11,13))}時

</text>

`:'').join('')}

</svg>

<small>単位：m/s</small>

</div>

`;

}

/* 潮汐情報保存 */

function saveTide07(e,i){

e.preventDefault();

let plans=read('plans');

let p=plans[i];

if(!p)return fishingDecision();

let events=[];

for(let j=0;j<4;j++){

let type=value('tideKind07_'+j);

let time=value('tideTime07_'+j);

let height=value('tideHeight07_'+j);

if(!time&&height==='')continue;

if(!time||height===''||
!Number.isFinite(Number(height))){

alert(
'時刻と潮位を両方入力してください。'
);

return;

}

if(events.some(t=>t.time===time)){

alert('同じ時刻が重複しています。');

return;

}

events.push({

type:type,

time:time,

height:Number(height)

});

}

if(!events.length){

alert('潮汐情報を入力してください。');

return;

}

events.sort(

Number(parts[0])*60+
Number(parts[1]);

height:t.height,

type:t.type,
