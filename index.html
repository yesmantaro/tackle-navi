
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TACKLE NAVI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf4fc;color:#123e60;font-family:sans-serif}
header{background:#123e60;color:white;padding:20px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:600px;margin:auto;padding:18px}
h2{margin-top:0}
.hero{background:linear-gradient(135deg,#176b9b,#123e60);color:white;padding:24px;border-radius:18px;margin-bottom:20px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:inherit;cursor:pointer}
.tile{background:white;border:1px solid #d6e5ef;border-radius:16px;padding:20px 8px;color:#123e60;font-size:16px;font-weight:bold;min-height:100px}
.tile span{display:block;font-size:32px;margin-bottom:8px}
.primary{width:100%;background:#176b9b;color:white;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:bold;margin-bottom:14px}
.back{background:white;border:1px solid #ccdce8;border-radius:10px;padding:12px;color:#123e60;margin-bottom:20px}
.panel{background:white;padding:18px;border-radius:14px;margin-bottom:14px;overflow-wrap:anywhere}
input,select{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ccdce8;border-radius:8px;font-size:16px}
footer{text-align:center;padding:20px;font-size:12px}
small{color:#52748c}
</style>
</head>
<body>
<header>🎣 TACKLE NAVI</header>
<main id="app"></main>
<footer>TACKLE NAVI | Ver. 0.2</footer>
<script>
const app=document.getElementById('app');
let planData={};
const db={
'アジ':['サビキ釣り','アジング','ウキ釣り'],
'サバ':['サビキ釣り','ショアジギング'],
'シーバス':['ルアー釣り','ウキ釣り'],
'ヒラメ':['ルアー釣り','泳がせ釣り'],
'クロダイ':['フカセ釣り','チニング'],
'メバル':['メバリング','ウキ釣り'],
'イカ':['エギング','ウキ釣り'],
'キス':['投げ釣り'],
'カサゴ':['穴釣り','ルアー釣り'],
'ブラックバス':['ルアー釣り'],
'トラウト':['ルアー釣り','エサ釣り'],
'アユ':['友釣り','エサ釣り'],
'コイ':['吸い込み釣り','ウキ釣り'],
'フナ':['ウキ釣り']
};
function read(key){
try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}
}
function write(key,data){
try{localStorage.setItem(key,JSON.stringify(data));return true}
catch(e){alert('保存できませんでした');return false}
}
function esc(v){
return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function back(fn){
return `<button class="back" onclick="${fn}()">← 戻る</button>`
}
function show(html){
app.innerHTML=html;
window.scrollTo(0,0);
}
function choices(items,fn,emoji){
return `<div class="menu">${items.map(x=>`<button class="tile" onclick="${fn}('${x}')"><span>${emoji}</span>${x}</button>`).join('')}</div>`
}
function home(){
show(`
<div class="hero">
<h2>次の釣りを、もっと楽しく。</h2>
<p>釣りの計画から釣果の記録まで。</p>
</div>
<button class="primary" onclick="start()">🎣 釣りを計画する</button>
<div class="menu">
<button class="tile" onclick="tackle()"><span>🎒</span>マイタックル</button>
<button class="tile" onclick="savedPlans()"><span>📅</span>マイ釣行プラン</button>
<button class="tile" onclick="pending('釣果記録')"><span>📷</span>釣果記録</button>
<button class="tile" onclick="pending('釣果アルバム')"><span>🐟</span>釣果アルバム</button>
<button class="tile" onclick="pending('全国釣果マップ')"><span>🗺️</span>全国釣果マップ</button>
<button class="tile" onclick="pending('ランキング')"><span>🏆</span>ランキング</button>
<button class="tile" onclick="pending('釣具データベース')"><span>🔍</span>釣具データベース</button>
<button class="tile" onclick="pending('設定')"><span>⚙️</span>設定</button>
</div>`)
}
function start(){
planData={};
water();
}
function water(){
show(back('home')+`
<h2>どこで釣りをする？</h2>
<button class="primary" onclick="fish('海釣り')">🌊 海釣り</button>
<button class="primary" onclick="fish('川・湖釣り')">🏞️ 川・湖釣り</button>`)
}
function fish(type){
planData.type=type;
fishScreen();
}
function fishScreen(){
let items=Object.keys(db);
items=planData.type==='海釣り'?items.slice(0,9):items.slice(9);
show(back('water')+`<small>STEP 1 / 5</small><h2>釣りたい魚を選択</h2>`+choices(items,'method','🐟'))
}
function method(name){
planData.fish=name;
methodScreen();
}
function methodScreen(){
show(back('fishScreen')+`<small>STEP 2 / 5</small><h2>${planData.fish}の釣り方</h2>`+choices(db[planData.fish],'place','🎣'))
}
function place(name){
planData.method=name;
placeScreen();
}
function placeScreen(){
let items=planData.type==='海釣り'?['堤防','漁港','砂浜','磯','船']:['河川','湖','池','管理釣り場'];
show(back('methodScreen')+`<small>STEP 3 / 5</small><h2>釣り場を選択</h2>`+choices(items,'recommend','📍'))
}
function gear(){
const data={
'サビキ釣り':['磯竿・万能竿','スピニングリール','サビキ仕掛け・コマセ'],
'アジング':['アジングロッド','小型スピニングリール','ジグヘッド・ワーム'],
'ショアジギング':['ショアジギングロッド','スピニングリール','メタルジグ'],
'エギング':['エギングロッド','スピニングリール','エギ'],
'メバリング':['メバリングロッド','小型スピニングリール','ジグヘッド・ワーム'],
'ルアー釣り':['対象魚用ルアーロッド','適合するリール','対象魚用ルアー'],
'投げ釣り':['投げ竿','スピニングリール','天秤・投げ仕掛け'],
'穴釣り':['短竿','小型リール','ブラクリ仕掛け'],
'フカセ釣り':['磯竿','スピニングリール','ウキ・ハリ・コマセ'],
'チニング':['チニングロッド','適合するリール','チニング用ルアー'],
'泳がせ釣り':['対象魚に合う竿','適合するリール','泳がせ仕掛け'],
'ウキ釣り':['対象魚に合う竿','必要に応じたリール','ウキ・ハリ・エサ'],
'友釣り':['アユ竿','不要','友釣り仕掛け'],
'エサ釣り':['対象魚に合う竿','必要に応じたリール','ハリ・エサ'],
'吸い込み釣り':['コイ用竿','適合するリール','吸い込み仕掛け']
};
return data[planData.method];
}
function recommend(name){
planData.place=name;
recommendScreen();
}
function recommendScreen(){
let g=gear();
let owned=read('tackle');
show(back('placeScreen')+`
<small>STEP 4 / 5</small>
<h2>おすすめタックル</h2>
<p>${planData.fish} × ${planData.method}</p>
${g.map((x,i)=>`<div class="panel"><b>${['ロッド','リール','仕掛け'][i]}</b><p>${x}</p></div>`).join('')}
<h3>マイタックルとの照合</h3>
<div class="panel">${g.map((x,i)=>{
let category=['ロッド','リール','仕掛け'][i];
let matches=owned.filter(t=>t.category===category);
return `<p><b>${category}</b><br>${x==='不要'?'不要':matches.length?matches.map(t=>esc(t.name)).join('、'):'未登録'}</p>`
}).join('')}
<small>登録カテゴリによる簡易照合です。実際の適合性は確認してください。</small>
</div>
<button class="primary" onclick="details()">釣行プランを作成する</button>`)
}
function details(){
show(back('recommendScreen')+`
<small>STEP 5 / 5</small>
<h2>釣行プラン作成</h2>
<div class="panel">
<p>対象魚：${planData.fish}</p>
<p>釣り方：${planData.method}</p>
<p>釣り場：${planData.place}</p>
</div>
<form onsubmit="savePlan(event)">
<label>釣行日<input type="date" id="date" required></label>
<label>釣り場の名称<input id="location" placeholder="例：〇〇漁港" required></label>
<label>メモ<input id="memo" placeholder="持ち物・集合時間など"></label>
<button class="primary">釣行プランを保存</button>
</form>`)
}
function savePlan(e){
e.preventDefault();
let data=read('plans');
data.push({...planData,date:document.getElementById('date').value,location:document.getElementById('location').value,memo:document.getElementById('memo').value});
if(write('plans',data)){
alert('釣行プランを保存しました');
savedPlans();
}
}
function savedPlans(){
let data=read('plans');
show(back('home')+`<h2>マイ釣行プラン</h2>`+
(data.length?data.map((p,i)=>`<div class="panel">
<b>${esc(p.date)}　${esc(p.fish)}</b>
<p>${esc(p.location)}</p>
<p>${esc(p.type)} / ${esc(p.method)} / ${esc(p.place)}</p>
<p>${esc(p.memo)}</p>
<button class="back" onclick="removeItem('plans',${i})">削除</button>
</div>`).join(''):'<p>保存されたプランはありません。</p>')+
`<button class="primary" onclick="start()">新しい釣行プラン</button>`)
}
function tackle(){
let data=read('tackle');
show(back('home')+`
<h2>マイタックル</h2>
<form class="panel" onsubmit="addTackle(event)">
<label>種類<select id="category">
<option>ロッド</option>
<option>リール</option>
<option>仕掛け</option>
</select></label>
<label>商品名<input id="name" placeholder="メーカー・商品名" required></label>
<button class="primary">タックルを登録</button>
</form>
${data.map((t,i)=>`<div class="panel"><small>${esc(t.category)}</small><p>${esc(t.name)}</p><button class="back" onclick="removeItem('tackle',${i})">削除</button></div>`).join('')}`)
}
function addTackle(e){
e.preventDefault();
let data=read('tackle');
data.push({category:document.getElementById('category').value,name:document.getElementById('name').value});
if(write('tackle',data))tackle();
}
function removeItem(key,i){
if(!confirm('削除しますか？'))return;
let data=read(key);
data.splice(i,1);
if(write(key,data)){
if(key==='plans')savedPlans();else tackle();
}
}
function pending(name){
show(back('home')+`<h2>${name}</h2><div class="panel">この機能は今後追加します。</div>`)
}
home();
</script>
</body>
</html>
